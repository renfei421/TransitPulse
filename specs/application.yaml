apiVersion: fission.io/v1
kind: Environment
metadata:
  name: transport-python
  namespace: default
  labels:
    app.kubernetes.io/part-of: transport-analytics
spec:
  version: 3
  poolsize: 0
  runtime:
    image: transport-fission:review
    container:
      name: transport-python
    podspec:
      containers:
      - name: transport-python
        envFrom:
        - configMapRef:
            name: transport-config
        - secretRef:
            name: transport-secrets
        volumeMounts:
        - name: es-ca
          mountPath: /etc/es-ca
          readOnly: true
      volumes:
      - name: es-ca
        secret:
          secretName: transport-es-ca
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
---
apiVersion: fission.io/v1
kind: Environment
metadata:
  name: transport-trigger-python
  namespace: default
  labels:
    app.kubernetes.io/part-of: transport-analytics
spec:
  version: 3
  poolsize: 0
  runtime:
    image: transport-fission:review
    container:
      name: transport-trigger-python
    podspec:
      containers:
      - name: transport-trigger-python
        envFrom:
        - configMapRef:
            name: transport-config
        - secretRef:
            name: transport-secrets
        volumeMounts:
        - name: es-ca
          mountPath: /etc/es-ca
          readOnly: true
      volumes:
      - name: es-ca
        secret:
          secretName: transport-es-ca
      serviceAccountName: transport-job-trigger
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
---
kind: ArchiveUploadSpec
name: transport-code
include:
- artifacts/transport-functions.zip
---
apiVersion: fission.io/v1
kind: Package
metadata:
  name: transport-python-code
  namespace: default
  labels:
    app.kubernetes.io/part-of: transport-analytics
status:
  buildstatus: succeeded
spec:
  environment:
    name: transport-python
    namespace: default
  deployment:
    type: url
    url: archive://transport-code
---
apiVersion: fission.io/v1
kind: Package
metadata:
  name: transport-trigger-python-code
  namespace: default
  labels:
    app.kubernetes.io/part-of: transport-analytics
status:
  buildstatus: succeeded
spec:
  environment:
    name: transport-trigger-python
    namespace: default
  deployment:
    type: url
    url: archive://transport-code
---
apiVersion: fission.io/v1
kind: Function
metadata:
  name: transport-api
  namespace: default
  labels:
    app.kubernetes.io/part-of: transport-analytics
spec:
  environment:
    name: transport-python
    namespace: default
  package:
    functionName: backend.api.app.main
    packageref:
      name: transport-python-code
      namespace: default
  functionTimeout: 30
  idletimeout: 120
  concurrency: 20
  requestsPerPod: 20
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: newdeploy
      MinScale: 1
      MaxScale: 3
      TargetCPUPercent: 70
      SpecializationTimeout: 120
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
---
