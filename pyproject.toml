[project]
name = "transport-discourse-platform"
version = "0.2.0"
description = "Reproducible transport-discourse ingestion, processing and analytics"
requires-python = ">=3.11,<3.14"
dependencies = [
  "Flask==3.1.2", "requests==2.32.5", "urllib3==2.5.0",
  "elasticsearch==8.19.1", "numpy==2.2.6", "scipy==1.16.2",
  "PyYAML==6.0.3", "redis==6.4.0", "websockets==15.0.1", "nltk==3.9.1", "vaderSentiment==3.3.2",
]

[project.optional-dependencies]
experiment = ["langid==1.1.6", "matplotlib==3.10.6"]
model = [
    "langid==1.1.6",
    "torch==2.8.0",
    "transformers==4.56.2",
]
notebook = ["pandas==2.3.2", "plotly==6.3.0", "ipywidgets==8.1.7", "ipykernel==6.30.1", "matplotlib==3.10.6"]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-cov==6.3.0", "ruff==0.13.2", "nbformat==5.10.4", "nbclient==0.10.2"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires TEST_ES_URL and/or TEST_REDIS_URL",
  "e2e: real service pipeline through HTTP handlers",
  "model: requires downloaded model weights",
]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".venv", "data", "artifacts"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
