apiVersion: v1
kind: Service
metadata:
  name: transport-redis
  namespace: default
  labels:
    app.kubernetes.io/part-of: transport-analytics
spec:
  clusterIP: None
  selector:
    app: transport-redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: transport-redis
  namespace: default
  labels:
    app.kubernetes.io/part-of: transport-analytics
spec:
  serviceName: transport-redis
  replicas: 1
  selector:
    matchLabels:
      app: transport-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: transport-analytics
        app: transport-redis
    spec:
      automountServiceAccountToken: false
      containers:
      - name: redis
        image: redis:7.4.5-alpine
        command:
        - sh
        - -ec
        - exec redis-server --appendonly yes --appendfsync everysec --requirepass
          "$REDIS_PASSWORD"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: transport-secrets
              key: REDIS_PASSWORD
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-inference
  namespace: default
  labels:
    app.kubernetes.io/part-of: transport-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transport-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: transport-analytics
        app: transport-inference
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: transport
        image: transport-model:review
        command:
        - python
        - -m
        - backend.ingestion.queue
        args:
        - worker
        envFrom:
        - configMapRef:
            name: transport-config
        - secretRef:
            name: transport-secrets
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: es-ca
          mountPath: /etc/es-ca
          readOnly: true
      volumes:
      - name: es-ca
        secret:
          secretName: transport-es-ca
      terminationGracePeriodSeconds: 330
      initContainers:
      - name: transport
        image: transport-app:review
        command:
        - python
        - -m
        - backend.ingestion.queue
        args:
        - init
        envFrom:
        - configMapRef:
            name: transport-config
        - secretRef:
            name: transport-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: es-ca
          mountPath: /etc/es-ca
          readOnly: true
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: transport-redis-auth
  namespace: default
  labels:
    app.kubernetes.io/part-of: transport-analytics
spec:
  secretTargetRef:
  - parameter: password
    name: transport-secrets
    key: REDIS_PASSWORD
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: transport-inference
  namespace: default
  labels:
    app.kubernetes.io/part-of: transport-analytics
spec:
  scaleTargetRef:
    name: transport-inference
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 4
  triggers:
  - type: redis-streams
    metadata:
      addressFromEnv: REDIS_ADDRESS
      stream: transport:inference
      consumerGroup: sentiment
      lagCount: '100'
      activationLagCount: '0'
    authenticationRef:
      name: transport-redis-auth
  - type: redis-streams
    metadata:
      addressFromEnv: REDIS_ADDRESS
      stream: transport:inference
      consumerGroup: sentiment
      pendingEntriesCount: '10'
    authenticationRef:
      name: transport-redis-auth
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: transport-publisher
  namespace: default
  labels: &id001
    app.kubernetes.io/part-of: transport-analytics
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: *id001
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
          - name: transport
            image: transport-app:review
            command:
            - python
            - -m
            - backend.ingestion.queue
            args:
            - publish
            envFrom:
            - configMapRef:
                name: transport-config
            - secretRef:
                name: transport-secrets
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: '1'
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: es-ca
              mountPath: /etc/es-ca
              readOnly: true
          volumes:
          - name: es-ca
            secret:
              secretName: transport-es-ca
