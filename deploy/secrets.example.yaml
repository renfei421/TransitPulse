# Template only. Fill locally and never commit populated credentials.
apiVersion: v1
kind: Secret
metadata:
  name: transport-secrets
  namespace: default
type: Opaque
stringData:
  ES_PASSWORD: REPLACE_LOCALLY
  REDIS_PASSWORD: REPLACE_WITH_URL_SAFE_RANDOM_VALUE
  REDIS_URL: redis://:REPLACE_WITH_URL_SAFE_RANDOM_VALUE@transport-redis:6379/0
  EIA_API_KEY: REPLACE_LOCALLY_IF_USING_EIA
  BLUESKY_HANDLE: ""
  BLUESKY_APP_PASSWORD: ""
  MASTODON_ACCESS_TOKEN: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: transport-es-ca
  namespace: default
type: Opaque
stringData:
  ca.crt: REPLACE_WITH_ELASTICSEARCH_CA_PEM
---
apiVersion: v1
kind: Secret
metadata:
  name: transport-migration-secrets
  namespace: default
type: Opaque
stringData:
  ES_USER: transport-migrator
  ES_PASSWORD: REPLACE_WITH_SEPARATE_SCHEMA_ADMIN_PASSWORD
